name: Source checks and release packages
on:
  pull_request:
  push:
    branches: ['main', 'codex/**']
    tags: ['fork-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Check tracked source and introduced objects
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 scripts/check_source_tree.py
          range=HEAD
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$BASE..HEAD"
          elif [ -n "$DEFAULT_BRANCH" ] && base=$(git merge-base HEAD "refs/remotes/origin/$DEFAULT_BRANCH"); then
            range="$base..HEAD"
          fi
          python3 scripts/check_source_tree.py --range "$range"
      - name: Verify locked public submodule commits
        run: python3 scripts/check_submodules.py
      - name: Build fixed Linux toolchain
        run: docker build -t fancyss-build -f scripts/Dockerfile.build scripts
      - name: Run packaging, lifecycle and client regressions
        run: |
          docker run --rm -v "$PWD:/source" fancyss-build bash -ec '
            git config --global --add safe.directory /source
            python3 -m unittest discover -s tests/packaging -v
            python3 -m unittest discover -s tests/native-anytls -p "test_*.py" -v
            cd tool/fss-anytls-client
            go test -race ./...
          '
  release:
    if: startsWith(github.ref, 'refs/tags/fork-v')
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Validate release tag
        run: |
          printf '%s\n' "$GITHUB_REF_NAME" | grep -E '^fork-v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$'
          case "$GITHUB_REF_NAME" in "fork-v$(head -1 fancyss/ss/version)-"*) ;; *) exit 1;; esac
      - name: Build complete package matrix
        run: |
          docker build -t fancyss-build -f scripts/Dockerfile.build scripts
          docker run --rm -v "$PWD:/source" fancyss-build bash -ec '
            git config --global --add safe.directory /source
            bash build.sh
            bash build.sh --offline
            python3 scripts/verify_packages.py packages
          '
          git diff --exit-code
      - name: Create release draft for manual acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" packages/*.tar.gz packages/SHA256SUMS \
            packages/release.json packages/version.json.js build-inputs.lock.json \
            --verify-tag --draft --latest=false --title "$GITHUB_REF_NAME" \
            --notes 'Complete platform matrix. Verify SHA256SUMS and perform device acceptance before publishing. Router upgrades use offline packages.'
